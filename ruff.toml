# Strict: every rule is on. Keep the ruff pin in pyproject.toml (`lint` extra)
# in sync with CI. Opt out per line with `# noqa: XXX` plus a reason, not here.
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules).
    "COM812",
    "ISC001",
    # Mutually exclusive docstring styles; we use D211 + D212.
    "D203",
    "D213",
    # No per-file copyright headers.
    "CPY001",
]

# Lets TC00x move typing-only imports under TYPE_CHECKING by adding
# `from __future__ import annotations` (3.12/3.13 evaluate annotations eagerly).
future-annotations = true

[lint.per-file-ignores]
# Inherited from prison-architect-server and not yet documented; see ROADMAP.md.
"src/pyphotonrealtime/protocol/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"tests/**" = [
    "S101",    # assert is how pytest works
    "D",       # test names are the documentation
    "PLR2004", # magic values are fine in assertions
    "SLF001",  # tests may poke private members
]

[lint.pydocstyle]
convention = "google"

[lint.flake8-type-checking]
strict = true

[format]
docstring-code-format = true
