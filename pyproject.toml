[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyPhotonRealtime"
version = "0.1.0.dev0"
description = "Pure-Python client for games running on Photon Realtime"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Michael K. Steinberg" }]
dependencies = [
    "pycryptodome>=3.20", # AES for encrypted operations / DH key exchange
]

[project.optional-dependencies]
lint = ["ruff==0.16.10", "mypy==2.4.0"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyphotonrealtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e", "--strict-markers"]
markers = ["e2e: talks to Photon Cloud (needs PHOTON_APP_ID) or runs the C++ SDK demos"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
